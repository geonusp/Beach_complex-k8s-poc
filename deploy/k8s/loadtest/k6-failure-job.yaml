apiVersion: batch/v1
kind: Job
metadata:
  name: beach-k6-failure
  namespace: beach
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beach-k6
        app.kubernetes.io/component: load-generator
    spec:
      restartPolicy: Never
      nodeSelector:
        node-role: observability
      containers:
        - name: k6
          image: grafana/k6:2.3.0
          command: ["k6", "run", "--quiet", "--out", "json=/dev/stdout", "/scripts/failure.js"]
          env:
            - name: K6_RATE
              value: "5"
            - name: BEACH_K6_DURATION
              value: "420s"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: scenario
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scenario
          configMap:
            name: beach-k6-failure
