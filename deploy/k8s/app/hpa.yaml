apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: beach-experiment
  namespace: beach
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: beach
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
