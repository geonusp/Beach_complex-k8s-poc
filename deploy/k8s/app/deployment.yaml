apiVersion: apps/v1
kind: Deployment
metadata:
  name: beach
  namespace: beach
  labels:
    app.kubernetes.io/name: beach
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: beach-complex
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: beach
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beach
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: beach-complex
    spec:
      nodeSelector:
        node-role: app
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: beach
              app.kubernetes.io/component: backend
      containers:
        - name: beach
          image: beach-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: beach-runtime
            - secretRef:
                name: beach-runtime
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: management
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
